# Stable topic per indicator. The first rule whose regex matches the indicator's clean
# name (all label levels joined by ' › ') wins; `domains` limits a rule to source sheets.
# Order matters: specific before general. Labels are CBS Hebrew.
# Every indicator must land in a topic other than 'other' unless listed in the report.

topics:
  - {key: budget_arnona,      name: 'תקציב: חיובי ארנונה',         regex: 'חיוב(י)? ארנונה|חיוב ארנונה'}
  - {key: budget_balance,     name: 'תקציב: עודף/גירעון ומלוות',   domains: [budget], regex: 'עודף|גירעון|עומס מלוות'}
  - {key: budget_expenditure, name: 'תקציב: הוצאות',               domains: [budget], regex: 'תשלומים|הוצאות|הוצאה'}
  - {key: budget_revenue,     name: 'תקציב: הכנסות',               domains: [budget], regex: 'תקבולים|הכנסות|הכנסה|מענק|מלוות|ארנונה|השתתפות|גבייה|גביית'}
  - {key: indices,            name: 'מדדים: חברתי-כלכלי, פריפריאליות, קומפקטיות, טופוגרפיה',
     regex: 'מדד חברתי|חברתי-כלכלי|חברתית-כלכלית|פריפריאל|קומפקטיות|טופוגרפי|ציון תקן'}
  - {key: elections,          name: 'בחירות',                       regex: 'בחירות|הצבעה'}
  - {key: survey,             name: 'סקר: שביעות רצון',             regex: 'מדדים סובייקטיביים|שביעות רצון|פונים לרשות'}
  - {key: land_use,           name: 'שימושי קרקע',                  regex: 'שימושי קרקע|שטח בקמ"ר|משטח השיפוט|משטח הרשות|מסך כל שטח שיפוט|מכלולי|אזור סלעי|מלונאות|שטח בנוי למגורים|שטח פתוח|שמורות טבע'}
  - {key: rc_settlements,     name: 'יישובים ומרחקים במועצות אזוריות',
     regex: 'יישובים במועצות|עבור מועצות אזוריות|יישובים במועצה|^מושבים|› מושבים|קיבוצים|יישובים מוסדיים|יישובים כפריים|יישובים קהילתיים|יישובים עירוניים|יישובים יהודיים|יישובים לא יהודיים|ממוצע המרחקים|מרחקים במועצות'}
  - {key: crime,              name: 'פשיעה ומשפט',                  regex: 'פשיעה|מורשעים|עבירות'}
  - {key: transport,          name: 'תחבורה',                       regex: 'תחבורה|רכב|מכוניות|תאונות|תאונה|הרוגים|נפגעים'}
  - {key: waste,              name: 'פסולת',                        regex: 'פסולת|מחזור'}
  - {key: construction_housing, name: 'בנייה ודיור',               regex: 'בנייה|דירות|צינורות|סלילת|כבישים|^דיור|› דיור'}
  - {key: water,              name: 'מים וביוב',                    regex: '(^|[ ›(])מים([ ›)]|$)|שפכים|ביוב|תיעול'}
  - {key: health,             name: 'בריאות',                       regex: 'בריאות|תוחלת|סוכרת|סכרת|סרטן|השמנה|עודף משקל'}
  - {key: income,             name: 'שכר והכנסה',
     regex: '^שכר ›|שכר ממוצע|שכר המינימום|שכר החציוני|בעלי הכנסה|עצמאים|עצמאי|שכירים|ג.יני|אי-השוויון|הכנסה ממוצעת|הכנסה חודשית'}
  - {key: welfare,            name: 'רווחה וביטוח לאומי',
     regex: 'רווחה|אבטלה|קצבא|גמל|הבטחת הכנסה|נכות|סיעוד|ניידות|זקנה|שאירים|הכשרה מקצועית|קופ"ח|קופות חולים|מבוטחים|מוגבלות|שבגינם'}
  - {key: education,          name: 'חינוך והשכלה',                 regex: 'חינוך|השכלה|תלמיד|בתי ספר|כיתות|בגרות|גנים|סטודנט|עובדי הוראה|נושרים|תואר|אקדמי|חטיבות ביניים|יסודיים|תיכוניים'}
  - {key: demography,         name: 'דמוגרפיה',
     regex: 'דמוגרפיה|אוכלוסי|גברים|נשים|בני \d|גילאי|לידות|פטירות|ריבוי|עולי|עולים|השתקעות|הגירה|נכנסים|יוצאים|מצב משפחתי|רווקים|נשואים|גרושים|אלמנים|נישאים|מתגרשים|יהודים|ערבים|מוסלמים|נוצרים|דרוזים|דיור משותף|מוסדות לינה|פריון|יחס תלות|תלות'}
  - {key: general,            name: 'כללי וגאוגרפיה',
     regex: 'כללי|^שטח|צפיפות|מחוז|^אזור$|מעמד מוניציפלי|ועדת תכנון|חברי מועצה|מרחק מגבול|קבלת מעמד|מרחב ימי|חוף|גובה|טמפ|אקלים|גשם|משקעים'}

# label prefixes that are too generic to decide the topic (removed before matching)
strip_prefixes: ['שכר ורווחה › ']
